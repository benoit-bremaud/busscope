# SonarQube project configuration
#
# Target: the shared self-hosted SonarQube Community Build at http://localhost:9000.
# Analysis is local and manual — no CI job: the Community Build analyses one branch only, and
# the server has no public ingress.
#
# Usage: see "Validation" in CONTRIBUTING.md. The scanner reads the global analysis token from
# the SONAR_TOKEN environment variable — never write a token in this file.

sonar.projectKey=can_sniffer
sonar.projectName=can_sniffer
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
