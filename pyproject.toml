[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "can-sniffer"
version = "0.1.1"
description = "Graphical CAN bus monitor for Infypower charger modules on Linux."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The serial extra pulls pyserial, required by the slcan backend; letting python-can
    # own that range avoids drifting from what it actually supports.
    "python-can[serial]>=4.5,<5",
    "PySide6>=6.8,<7",
]

[project.scripts]
can-sniffer = "can_sniffer.app:main"

[project.optional-dependencies]
dev = [
    "interrogate>=1.7,<2",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/can_sniffer"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=can_sniffer --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.interrogate]
# Docstring floor of the pre-merge gate; enforced in CI so it cannot silently drift again.
fail-under = 90
ignore-init-module = true
exclude = ["tests"]
verbose = 1

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
