name: Python quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba
        with:
          python-version: "3.12"

      - name: Install Qt runtime dependency
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libegl1

      - name: Create isolated test environment
        run: python -m venv .venv-test

      - name: Install development dependencies
        run: .venv-test/bin/python -m pip install -e '.[dev]'

      - name: Run tests with coverage gate
        run: .venv-test/bin/python -m pytest

      - name: Run Ruff
        run: .venv-test/bin/ruff check .

      - name: Check Ruff formatting
        run: .venv-test/bin/ruff format --check .

      - name: Run Mypy
        run: .venv-test/bin/mypy

      - name: Run Interrogate
        run: .venv-test/bin/interrogate src
